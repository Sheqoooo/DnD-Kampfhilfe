name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test combat and campaign logic
        run: node --test tests/*.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare stable app URLs
        run: |
          mkdir -p _site/dist
          cp -R dist/. _site/
          cp -R dist/. _site/dist/
      - name: Upload app
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
